<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clasificador de Frutas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:  #63fd60 ;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            padding: 30px;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
            font-style: italic;
        }
        
        .upload-area {
            border: 3px dashed #e6f87e;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 20px;
            background: #f9f9f9;
            transition: all 0.3s ease;
        }
        
        .upload-area:hover {
            border-color: #4f8f3f;
            transform: scale(1.02);
        }
        
        .upload-area.dragover {
            background: #e8f5e9;
            border-color: #2ebd3a;
            transform: scale(1.05);
        }
        
        .upload-text {
            color: #4f8f3f;
            font-size: 16px;
            margin-bottom: 10px;
        }
        
        .upload-text p {
            margin: 5px 0;
        }
        
        button {
            width: 100%;
            padding: 12px 20px;
            background: #1ef85f;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
        }
        
        button:hover {
            background: #37a12d;
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        

        
        .result {
            display: none;
            background: #22c55e;
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .result.error {
            background: #ef4444;
        }
        
        .image-preview {
            margin: 20px 0;
            text-align: center;
        }
        
        .image-preview img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .error-message {
            color: #ef4444;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Clasificador de imagenes</h1>
        <p class="subtitle">Sube una imagen y aparecera tu predicción</p>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-text">
                <p>Sube tu imagen aqui</p>
            </div>
            <input type="file" id="fileInput" accept="image/*" style="display: none;">
        </div>
        
        <button id="uploadBtn" disabled>Analizar</button>
        
        <div class="loading" id="loading">
            <p style="color: #667eea; font-size: 14px;">Analizando...</p>
        </div>
        
        <div class="image-preview" id="imagePreview" style="display: none;">
            <img id="previewImg" src="" alt="Preview">
        </div>
        
        <div class="result" id="result"></div>
    </div>

    <script>
        // elementos
        let zona_suba = document.getElementById('uploadArea');
        let inp_archivo = document.getElementById('fileInput');
        let btn_enviar = document.getElementById('uploadBtn');
        let div_cargando = document.getElementById('loading');
        let div_resultado = document.getElementById('result');
        let div_vista = document.getElementById('imagePreview');
        let img_preview = document.getElementById('previewImg');
        
        let url_servidor = 'http://localhost:8000';
        
        let archivo_seleccionado = null;
        
        // click en el area
        zona_suba.addEventListener('click', () => {
            inp_archivo.click();
        });
        
        // cuando selecciona archivo
        inp_archivo.addEventListener('change', (evt) => {
            archivo_seleccionado = evt.target.files[0];
            ver_preview(archivo_seleccionado);
        });
        
        // drag over
        zona_suba.addEventListener('dragover', (evt) => {
            evt.preventDefault();
            zona_suba.classList.add('dragover');
        });
        
        // drag leave
        zona_suba.addEventListener('dragleave', () => {
            zona_suba.classList.remove('dragover');
        });
        
        // drop
        zona_suba.addEventListener('drop', (evt) => {
            evt.preventDefault();
            zona_suba.classList.remove('dragover');
            archivo_seleccionado = evt.dataTransfer.files[0];
            ver_preview(archivo_seleccionado);
        });
        
        // mostrar preview
        function ver_preview(f) {
            if (!f) return;
            
            let lector = new FileReader();
            
            lector.onload = (evt) => {
                img_preview.src = evt.target.result;
                div_vista.style.display = 'block';
                btn_enviar.disabled = false;
                div_resultado.style.display = 'none';
            };
            
            lector.readAsDataURL(f);
        }
        
        // cuando hace click en analizar
        btn_enviar.addEventListener('click', async () => {
            if (!archivo_seleccionado) {
                return;
            }
            
            let form = new FormData();
            form.append('file', archivo_seleccionado);
            
            div_cargando.style.display = 'block';
            div_resultado.style.display = 'none';
            btn_enviar.disabled = true;
            
            try {
                let resp = await fetch(`${url_servidor}/predict`, {
                    method: 'POST',
                    body: form
                });
                
                let info = await resp.json();
                
                if (resp.ok) {
                    mostrar_exito(info);
                }
            } catch (err) {
            } finally {
                div_cargando.style.display = 'none';
                btn_enviar.disabled = false;
            }
        });
        
        // devuelve predicción
        function mostrar_exito(d) {
            let fruta = d.categoria || 'algo';
            
            div_resultado.innerHTML = `
                <h3>Es una: ${fruta}</h3>
            `;
            div_resultado.className = 'result';
            div_resultado.style.display = 'block';
        }
        
    </script>
</body>
</html>
